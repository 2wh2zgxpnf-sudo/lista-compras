<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>Lista de compras</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2421; --muted: #6b716d;
    --line: #e4e0d8; --accent: #2f6b4f; --accent-ink: #ffffff; --chip: #ebe7de;
    --done: #a3a8a4; --warn-bg: #fff4d6; --warn-ink: #6b5200;
    --p1: #c2410c; --p1-bg: #fde8dc; --p2: #8a6d00; --p2-bg: #fbf0c9; --p3: #4b6b5a; --p3-bg: #e3ede7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141715; --card: #1d211f; --ink: #eef0ee; --muted: #9aa19c;
      --line: #2c322f; --accent: #5fb38a; --accent-ink: #0d1510; --chip: #262b28;
      --done: #626964; --warn-bg: #3a3112; --warn-ink: #f1d98a;
      --p1: #ff9b6b; --p1-bg: #3d2117; --p2: #e8c65a; --p2-bg: #352d12; --p3: #9cc7ae; --p3-bg: #1f2d25;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(40px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
  .estado { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  .punto.ok { background: var(--accent); }
  .aviso { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px;
    padding: 10px 12px; font-size: .85rem; margin-top: 14px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; color: inherit; }

  /* Pestañas */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 18px;
    background: var(--chip); padding: 4px; border-radius: 14px; }
  .tab { background: transparent; padding: 9px 4px; font-size: .92rem; font-weight: 600; color: var(--muted); border-radius: 10px; }
  .tab[aria-selected=true] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .tab .n { font-weight: 500; opacity: .7; }

  /* Formulario */
  .barra { position: sticky; top: 0; padding: 10px 0 6px; background: var(--bg); z-index: 2; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 13px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .agregar { background: var(--accent); color: var(--accent-ink); padding: 0 18px; font-weight: 600; }
  .opciones { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; align-items: center; }
  .grupo { display: flex; gap: 4px; align-items: center; }
  .grupo > span { font-size: .75rem; color: var(--muted); margin-right: 2px; }
  .opt { font-size: .82rem; padding: 5px 10px; border-radius: 999px; background: transparent; border: 1.5px solid var(--line); color: var(--muted); }
  .opt[aria-pressed=true] { border-color: currentColor; font-weight: 600; }
  /* Desplegable de prioridad (formulario y cada producto) */
  .sel { position: relative; display: inline-flex; flex: none; color: var(--c); }
  .sel::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-52%);
    font-size: .7rem; pointer-events: none; }
  .sel select { appearance: none; -webkit-appearance: none; font: inherit; font-weight: 600; color: inherit;
    background: var(--cbg); border: 1.5px solid transparent; border-radius: 999px; cursor: pointer; }
  .sel select:focus-visible { outline: none; border-color: currentColor; }
  .sel select option { color: var(--ink); background: var(--card); }
  .opciones .sel select { font-size: .82rem; padding: 5px 24px 5px 11px; }
  .opt.sec[aria-pressed=true] { color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
  .chip { background: var(--chip); padding: 7px 12px; border-radius: 999px; font-size: .9rem; }
  .chip::before { content: "+ "; color: var(--muted); }

  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 22px 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 .marca { display: inline-flex; align-items: center; gap: 7px; }
  h2 .marca::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  li { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 0; border-top: 1px solid var(--line); min-height: 52px;
    border-left: 4px solid var(--c, transparent); padding-left: 10px; }
  li:first-child { border-top: 0; }
  .check { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--line);
    background: transparent; display: grid; place-items: center; padding: 0; }
  li.ok { border-left-color: transparent; }
  li.ok .check { background: var(--accent); border-color: var(--accent); }
  li.ok .check::after { content: ""; width: 7px; height: 12px; border: solid var(--accent-ink);
    border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .nombre { flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 10px 0; }
  .nombre small { display: block; font-size: .72rem; color: var(--muted); margin-top: 1px; }
  li.ok .nombre { color: var(--done); text-decoration: line-through; }
  li .sel select { font-size: .72rem; padding: 5px 22px 5px 9px; }
  .borrar { background: transparent; color: var(--muted); width: 38px; height: 40px; font-size: 1.3rem; line-height: 1; flex: none; }
  .vacio { color: var(--muted); text-align: center; padding: 28px 12px; font-size: .95rem; justify-content: center; border-left: 0; }
  .enlace { background: transparent; color: var(--accent); font-size: .8rem; padding: 4px 0; font-weight: 600; text-transform: none; letter-spacing: 0; }
  footer { margin-top: 28px; display: flex; justify-content: center; }
  .secundario { background: var(--chip); padding: 10px 16px; font-size: .9rem; }
  .ayuda { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🛒 Compras</h1>
    <span class="estado"><span class="punto" id="punto"></span><span id="estado">Cargando…</span></span>
  </header>
  <div class="aviso" id="aviso" hidden></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div class="barra">
    <form id="form" autocomplete="off">
      <input type="text" id="entrada" enterkeyhint="done" aria-label="Producto">
      <button class="agregar" type="submit">Añadir</button>
    </form>
    <div class="opciones">
      <div class="grupo" id="grupoSec" hidden><span>Lista</span></div>
      <div class="grupo"><span>Prioridad</span><span id="prioForm"></span></div>
    </div>
  </div>
  <div class="chips" id="sugerencias"></div>

  <div id="pendientes"></div>

  <section id="secHechos" hidden>
    <h2><span>En el carrito</span><button class="enlace" id="limpiar">Borrar comprados</button></h2>
    <ul id="hechos"></ul>
  </section>

  <p class="ayuda">Para cambiar la prioridad de un producto, toca su etiqueta de color.</p>
  <footer><button class="secundario" id="compartir">Compartir enlace con la familia</button></footer>
</main>

<script src="config.js?v=2"></script>
<script type="module">
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const $ = (id) => document.getElementById(id);
const normal = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[.#$\[\]\/~]/g, "_").trim();
const sinCantidad = (s) => s.replace(/^\d+\s*/, "");
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const SECCIONES = {
  mercado: { nombre: "Mercado", ayuda: "Comida, aseo, despensa…", ej: "Añadir al mercado… (ej. 2 leches)" },
  casa: { nombre: "Casa", ayuda: "Decoración, ferretería, hogar…", ej: "Añadir para la casa… (ej. tornillos)" },
};
const PRIORIDADES = {
  1: { nombre: "Urgente", c: "var(--p1)", bg: "var(--p1-bg)" },
  2: { nombre: "Normal", c: "var(--p2)", bg: "var(--p2-bg)" },
  3: { nombre: "Puede esperar", c: "var(--p3)", bg: "var(--p3-bg)" },
};
// Los productos creados antes de las secciones/prioridades se tratan como Mercado / Normal.
const secDe = (it) => (it.s in SECCIONES ? it.s : "mercado");
const prioDe = (it) => (it.p in PRIORIDADES ? Number(it.p) : 2);

const guardado = (k, def) => { try { return localStorage.getItem(k) || def; } catch { return def; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let vista = guardado("vista", "todo");          // todo | mercado | casa
let secNueva = guardado("secNueva", "mercado"); // sección al añadir desde "Todo"
let prioNueva = 2;

// La clave de la lista viaja en el enlace del NFC (#k=...) y nunca está en el repositorio.
function leerClave() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{20,})/);
  if (m) { guardar("clave", m[1]); return m[1]; }
  return guardado("clave", null);
}

let datos = { items: {}, hist: {} };
let tienda;

// ---- Almacenamiento: Firebase (compartido) o local (solo este celular) ----
async function tiendaFirebase(clave) {
  const { initializeApp } = await import(FB + "firebase-app.js");
  const d = await import(FB + "firebase-database.js");
  const db = d.getDatabase(initializeApp(window.FIREBASE_CONFIG));
  const base = d.ref(db, "listas/" + clave);
  d.onValue(d.ref(db, ".info/connected"), (s) => conectado(s.val() === true));
  return {
    escuchar: (cb) => d.onValue(base, (s) => cb(s.val() || {}), (e) => error(e)),
    cambiar: (rutas) => d.update(base, rutas).catch(error),
    sumar: () => d.increment(1),
  };
}

function tiendaLocal() {
  let cb = () => {};
  let estado = {};
  try { estado = JSON.parse(localStorage.getItem("lista-local")) || {}; } catch {}
  return {
    escuchar: (f) => { cb = f; f(estado); },
    cambiar: (rutas) => {
      for (const [ruta, valor] of Object.entries(rutas)) {
        const partes = ruta.split("/"); let o = estado;
        for (const p of partes.slice(0, -1)) o = o[p] ??= {};
        const ult = partes.at(-1);
        if (valor === null) delete o[ult];
        else if (valor && valor.__sumar) o[ult] = (o[ult] || 0) + 1;
        else o[ult] = valor;
      }
      guardar("lista-local", JSON.stringify(estado));
      cb(estado);
    },
    sumar: () => ({ __sumar: true }),
  };
}

function conectado(ok) {
  $("punto").classList.toggle("ok", ok);
  $("estado").textContent = ok ? "Sincronizada" : "Sin conexión";
}
function error(e) { avisar("No se pudo sincronizar: " + (e?.message || e)); }
function avisar(txt) { $("aviso").textContent = txt; $("aviso").hidden = false; }

// ---- Acciones ----
function agregar(texto, sec = vista === "todo" ? secNueva : vista, prio = prioNueva) {
  texto = texto.trim().replace(/\s+/g, " ");
  if (!texto) return;
  const nombre = texto[0].toUpperCase() + texto.slice(1);
  const base = sinCantidad(nombre);
  const ya = Object.values(datos.items || {}).some((it) => !it.ok && secDe(it) === sec && normal(it.n) === normal(nombre));
  if (ya) return;
  const h = sec + "~" + normal(base);
  tienda.cambiar({
    ["items/" + nuevoId()]: { n: nombre, s: sec, p: prio, ok: false, t: Date.now() },
    ["hist/" + h + "/n"]: base,
    ["hist/" + h + "/s"]: sec,
    ["hist/" + h + "/c"]: tienda.sumar(),
  });
}
const marcar = (id, ok) => tienda.cambiar({ ["items/" + id + "/ok"]: ok, ["items/" + id + "/t"]: Date.now() });
const quitar = (id) => tienda.cambiar({ ["items/" + id]: null });
const cambiarPrio = (id, p) => tienda.cambiar({ ["items/" + id + "/p"]: p });

// Desplegable de prioridad con el color del nivel elegido.
function selectorPrio(valor, alCambiar, etiqueta) {
  const s = nuevo("select", {}, ...Object.entries(PRIORIDADES).map(([p, d]) =>
    nuevo("option", { value: p, selected: Number(p) === valor }, d.nombre)));
  s.setAttribute("aria-label", etiqueta);
  const caja = nuevo("span", { className: "sel" }, s);
  const colorear = () => {
    caja.style.setProperty("--c", PRIORIDADES[s.value].c);
    caja.style.setProperty("--cbg", PRIORIDADES[s.value].bg);
  };
  colorear();
  s.onchange = () => { colorear(); alCambiar(Number(s.value)); };
  return caja;
}
function limpiar() {
  const rutas = {};
  for (const [id, it] of Object.entries(datos.items || {}))
    if (it.ok && (vista === "todo" || secDe(it) === vista)) rutas["items/" + id] = null;
  tienda.cambiar(rutas);
}

// ---- Pintar ----
function nuevo(tag, props = {}, ...hijos) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...hijos);
  return e;
}

function fila(id, it) {
  const p = PRIORIDADES[prioDe(it)];
  const li = nuevo("li", { className: it.ok ? "ok" : "" });
  li.style.setProperty("--c", p.c);
  li.style.setProperty("--cbg", p.bg);
  const c = nuevo("button", { className: "check", onclick: () => marcar(id, !it.ok) });
  c.setAttribute("aria-label", it.ok ? "Desmarcar " + it.n : "Marcar " + it.n + " como comprado");
  const n = nuevo("span", { className: "nombre", onclick: c.onclick }, it.n);
  if (vista === "todo") n.append(nuevo("small", {}, SECCIONES[secDe(it)].nombre));
  li.append(c, n);
  if (!it.ok) {
    li.append(selectorPrio(prioDe(it), (np) => cambiarPrio(id, np), "Prioridad de " + it.n));
  }
  const x = nuevo("button", { className: "borrar", onclick: () => quitar(id) }, "×");
  x.setAttribute("aria-label", "Eliminar " + it.n);
  li.append(x);
  return li;
}

function pintarControles(items) {
  const pend = (s) => items.filter(([, i]) => !i.ok && (s === "todo" || secDe(i) === s)).length;
  $("tabs").replaceChildren(...["todo", "mercado", "casa"].map((s) => {
    const n = pend(s);
    const b = nuevo("button", { className: "tab", onclick: () => { vista = s; guardar("vista", s); pintar(); } },
      s === "todo" ? "Todo" : SECCIONES[s].nombre, nuevo("span", { className: "n" }, n ? ` ${n}` : ""));
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", vista === s);
    return b;
  }));

  $("entrada").placeholder = SECCIONES[vista === "todo" ? secNueva : vista].ej;
  $("grupoSec").hidden = vista !== "todo";
  $("grupoSec").replaceChildren($("grupoSec").firstElementChild,
    ...Object.entries(SECCIONES).map(([s, d]) => {
      const b = nuevo("button", { type: "button", className: "opt sec", onclick: () => { secNueva = s; guardar("secNueva", s); pintar(); } }, d.nombre);
      b.setAttribute("aria-pressed", secNueva === s);
      return b;
    }));
}

// Cada producto nuevo arranca en Normal; tras añadirlo el desplegable vuelve a Normal.
function reiniciarPrioForm() {
  prioNueva = 2;
  $("prioForm").replaceChildren(selectorPrio(2, (p) => { prioNueva = p; }, "Prioridad del producto nuevo"));
}

function pintar() {
  const items = Object.entries(datos.items || {});
  const visibles = items.filter(([, i]) => vista === "todo" || secDe(i) === vista);
  const pend = visibles.filter(([, i]) => !i.ok);
  const hechos = visibles.filter(([, i]) => i.ok).sort((a, b) => b[1].t - a[1].t);
  pintarControles(items);

  // Triage: un bloque por prioridad, de más a menos urgente.
  const bloques = [];
  for (const p of [1, 2, 3]) {
    const grupo = pend.filter(([, i]) => prioDe(i) === p).sort((a, b) => a[1].t - b[1].t);
    if (!grupo.length) continue;
    const h = nuevo("h2", {}, nuevo("span", { className: "marca" }, `${PRIORIDADES[p].nombre} · ${grupo.length}`));
    h.style.setProperty("--c", PRIORIDADES[p].c);
    bloques.push(h, nuevo("ul", {}, ...grupo.map(([id, it]) => fila(id, it))));
  }
  if (!pend.length) {
    const txt = vista === "todo" ? "Nada pendiente. Añade lo que haga falta."
      : `Nada pendiente en ${SECCIONES[vista].nombre}. ${SECCIONES[vista].ayuda}`;
    bloques.push(nuevo("h2", {}, "Por comprar"), nuevo("ul", {}, nuevo("li", { className: "vacio" }, txt)));
  }
  $("pendientes").replaceChildren(...bloques);

  $("hechos").replaceChildren(...hechos.map(([id, it]) => fila(id, it)));
  $("secHechos").hidden = !hechos.length;

  // Sugerencias: lo que más se compra en esta sección y no está pendiente.
  const secSug = vista === "todo" ? secNueva : vista;
  const pendNorm = new Set(items.filter(([, i]) => !i.ok && secDe(i) === secSug).map(([, i]) => normal(sinCantidad(i.n))));
  const sug = Object.values(datos.hist || {})
    .filter((h) => (h.s || "mercado") === secSug && h.n && !pendNorm.has(normal(h.n)))
    .sort((a, b) => (b.c || 0) - (a.c || 0)).slice(0, 12);
  $("sugerencias").replaceChildren(...sug.map((h) =>
    nuevo("button", { className: "chip", onclick: () => agregar(h.n, secSug) }, h.n)));
}

// ---- Inicio ----
$("form").onsubmit = (e) => {
  e.preventDefault();
  agregar($("entrada").value);
  $("entrada").value = "";
  reiniciarPrioForm();
  $("entrada").focus();
};
reiniciarPrioForm();
$("limpiar").onclick = limpiar;
$("compartir").onclick = async () => {
  const clave = leerClave();
  const url = location.origin + location.pathname + (clave ? "#k=" + clave : "");
  try {
    if (navigator.share) await navigator.share({ title: "Lista de compras", url });
    else { await navigator.clipboard.writeText(url); avisar("Enlace copiado."); }
  } catch {}
};

pintar();
const clave = leerClave();
if (window.FIREBASE_CONFIG && clave) {
  try { tienda = await tiendaFirebase(clave); }
  catch (e) { tienda = tiendaLocal(); avisar("No se pudo conectar con la nube; usando modo local."); }
} else {
  tienda = tiendaLocal();
  $("estado").textContent = "Solo este celular";
  avisar(window.FIREBASE_CONFIG
    ? "Abre la lista desde el NFC o el enlace compartido para ver la lista de la casa."
    : "Modo local: la lista se guarda solo en este celular hasta conectar la base de datos.");
}
tienda.escuchar((v) => { datos = v; pintar(); });
</script>
</body>
</html>
